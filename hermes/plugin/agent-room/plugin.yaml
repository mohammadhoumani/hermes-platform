name: agent-room
version: 1.0.0
description: "Records what Hermes agents do (messages, tool calls, sub-agents, approvals, skills) as sanitized JSON lines for the Agent Room live dashboard. Observer only: never blocks or changes a tool call."
author: "Mohammad Houmani"
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_skill_lifecycle
  - subagent_start
  - subagent_stop
  - on_human_input_request
  - on_human_input_resolved
  - pre_approval_request
  - post_approval_response
  - on_session_end
