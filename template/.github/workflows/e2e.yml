# End-to-end tests (Playwright) against a running site. Used by the QA agent.
#
#   gh workflow run e2e.yml                       test the staging address of the latest commit on main
#   gh workflow run e2e.yml -f url=https://...    test this address
#   gh run watch <run id>                         wait for it; the report is the artifact "playwright-report"
#
# If no address is given, it reads the commit status "staging-url" that deploy.yml sets on the commit.
# Optional secret VERCEL_AUTOMATION_BYPASS_SECRET lets the tests through Vercel Deployment Protection.
name: E2E

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Address to test. Empty = the staging address of the commit below."
        type: string
        default: ""
      ref:
        description: "Branch, tag or commit whose tests and staging address to use."
        type: string
        default: main
  workflow_call:
    inputs:
      url:
        type: string
        default: ""
      ref:
        type: string
        default: main

permissions:
  contents: read
  statuses: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_URL: ${{ inputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Find the address to test
        id: target
        run: |
          url="$INPUT_URL"
          if [ -z "$url" ]; then
            sha="$(git rev-parse HEAD)"
            url="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" --jq '[.statuses[] | select(.context == "staging-url")][0].target_url // empty')"
          fi
          if ! [[ "$url" =~ ^https://[A-Za-z0-9.-]+(/.*)?$ ]]; then
            echo "::error::No address to test. Pass url=https://... or wait for the staging deploy of this commit." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Testing $url"

      - name: Install
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.url }}
        run: npx playwright test

      - name: Summary
        if: ${{ always() }}
        env:
          E2E_URL: ${{ steps.target.outputs.url }}
          E2E_RESULT: ${{ job.status }}
        run: |
          {
            echo "### End-to-end tests: ${E2E_RESULT}"
            echo
            echo "- Address: ${E2E_URL:-unknown}"
            echo "- Report: download the artifact \`playwright-report\` from this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
